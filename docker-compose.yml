services:
  html_editor:
    build:
      context: .
      dockerfile: Dockerfile
    image: html_editor:latest
    container_name: html_editor
    # Match the host account so projects created in Docker remain writable in
    # host desktop mode and do not become owned by nobody/root.
    user: "${HTML_EDITOR_UID:-1000}:${HTML_EDITOR_GID:-1000}"
    ports:
      - "${HTML_EDITOR_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      # Docker requires a network listener; interactive login is intentionally disabled in this mode.
      HTML_EDITOR_HOST: 0.0.0.0
      HTML_EDITOR_CHROMIUM_PATH: /usr/bin/chromium
      PINEPAPER_ROOT: /opt/pinepaper
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./projects:/app/projects
    restart: unless-stopped
